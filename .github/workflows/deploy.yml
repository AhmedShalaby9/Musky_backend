name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o musky-server ./cmd/server/

      - name: Stop service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: systemctl stop musky

      - name: Upload binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: musky-server
          target: /opt/musky/
          overwrite: true

      - name: Start service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -eu
            chmod +x /opt/musky/musky-server
            systemctl reset-failed musky || true
            systemctl start musky
            for i in $(seq 1 10); do
              if systemctl is-active --quiet musky && curl -fsS http://127.0.0.1:8080/health >/dev/null; then
                echo "musky is active and healthy"
                exit 0
              fi
              sleep 1
            done
            systemctl status musky --no-pager || true
            journalctl -u musky -n 100 --no-pager || true
            exit 1
